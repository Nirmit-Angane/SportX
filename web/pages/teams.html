<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams Directory | SPORTX</title>
    <link rel="stylesheet" href="../css/style.css?v=1791566440">
    <link rel="stylesheet" href="../css/components.css?v=1791566440">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
        <nav class="status-bar navbar">
        <div class="container sb-container">
            <a href="../index.html" class="sb-brand brand">SPORTX</a>
            <div class="sb-nav nav-links">
                <a href="../index.html">Home</a>
                <a href="events.html">Events</a>
                <a href="matches.html">Matches</a>
                <a href="brackets.html">Brackets</a>
                <a href="teams.html" class="active">Teams</a>
                <a href="register.html">Register</a>
                <a href="../login.html">Admin</a>
            </div>
            <div class="sb-right nav-actions">
                <button class="btn-icon"><i data-lucide="search"></i></button>
                <div class="live-clock">LIVE &middot; <span id="global-clock">00:00:00</span></div>
            </div>
        </div>
    </nav>

    <div class="container section">
        <h1 style="font-size: 3rem; margin-bottom: 2rem;">TEAMS DIRECTORY</h1>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem;" id="teams-grid">
            <div class="skeleton" style="height: 250px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 250px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 250px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 250px; border-radius: var(--radius-lg);"></div>
        </div>
    </div>

    <script src="../js/api.js?v=1791566440"></script>
    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetchAPI('/teams');
            const gridEl = document.getElementById('teams-grid');
            
            if (res.success) {
                if (res.data.length === 0) {
                    gridEl.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><h3>NO TEAMS</h3><p>There are currently no registered teams.</p></div>`;
                    return;
                }
                
gridEl.innerHTML = res.data.map((team, index) => {
    const pClass = 'team-pattern-' + (index % 8);
    return `
    <a href="#" class="team-card ${pClass}">
        <div class="team-badge">
            ${team.name.charAt(0)}
            <div class="badge-pattern"></div>
        </div>
        <div class="team-name">${team.name}</div>
        <div class="team-stats">${team.city || 'LOCATION TBA'}</div>
        <button class="btn btn-primary" style="color: var(--ink); width: 100%;">TEAM PROFILE</button>
    </a>
    `;
}).join('');

            } else {
                gridEl.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Failed to load teams.</div>';
            }
        });
    </script>
<script src="../js/ui.js?v=1791566440"></script>
</body>
</html>
