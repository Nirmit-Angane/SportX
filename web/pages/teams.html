<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams Directory | SPORTX</title>
    <link rel="stylesheet" href="../css/style.css?v=1791546766">
    <link rel="stylesheet" href="../css/components.css?v=1791546766">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="../index.html?v=1791546347" class="brand">SPORTX</a>
            <div class="nav-links">
                <a href="../index.html?v=1791546347">Home</a>
                <a href="events.html?v=1791546347">Events</a>
                <a href="matches.html?v=1791546347">Matches</a>
                <a href="brackets.html?v=1791546347">Brackets</a>
                <a href="teams.html?v=1791546347" class="active">Teams</a>
                <a href="register.html?v=1791546347">Register</a>
                <a href="../login.html?v=1791546347">Admin</a>
            </div>
            <div class="nav-actions">
                <button class="btn btn-secondary" style="padding: 0.5rem;"><i data-lucide="search"></i></button>
            </div>
        </div>
    </nav>

    <div class="container section">
        <h1 style="font-size: 3rem; margin-bottom: 2rem;">TEAMS DIRECTORY</h1>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem;" id="teams-grid">
            <div class="skeleton" style="height: 250px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 250px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 250px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 250px; border-radius: var(--radius-lg);"></div>
        </div>
    </div>

    <script src="../js/api.js?v=1791546766"></script>
    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetchAPI('/teams');
            const gridEl = document.getElementById('teams-grid');
            
            if (res.success) {
                if (res.data.length === 0) {
                    gridEl.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><h3>NO TEAMS</h3><p>There are currently no registered teams.</p></div>`;
                    return;
                }
                gridEl.innerHTML = res.data.map(team => `
                    <div class="card" style="text-align: center;">
                        <div style="width: 100px; height: 100px; border-radius: 50%; background: var(--surface-elevated); margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-family: var(--font-display); border: 2px solid var(--border-color);">
                            ${team.name.charAt(0)}
                        </div>
                        <h3 style="font-size: 1.75rem; margin-bottom: 0.5rem;">${team.name}</h3>
                        <p class="text-muted" style="margin-bottom: 1.5rem; font-size: 1rem; text-transform: uppercase;">${team.city || 'Location TBA'}</p>
                        <button class="btn btn-secondary" style="width: 100%; font-size: 0.9rem;" disabled>TEAM PROFILE</button>
                    </div>
                `).join('');
            } else {
                gridEl.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Failed to load teams.</div>';
            }
        });
    </script>
<script src="../js/ui.js?v=1791546766"></script>
</body>
</html>
