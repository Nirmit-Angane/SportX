<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Tournaments | SPORTX</title>
    <link rel="stylesheet" href="../css/style.css?v=1791806722">
    <link rel="stylesheet" href="../css/components.css?v=1791806722">
    <link rel="stylesheet" href="../css/responsive.css?v=1791806722">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
        <nav class="status-bar navbar">
        <div class="container sb-container">
            <a href="../index.html" class="sb-brand brand">SPORTX</a>
            <div class="sb-nav nav-links">
                <a href="../index.html">Home</a>
                <a href="events.html" class="active">Events</a>
                <a href="matches.html">Matches</a>
                <a href="brackets.html">Brackets</a>
                <a href="teams.html">Teams</a>
                <a href="register.html">Register</a>
                <a href="../login.html">Admin</a>
            </div>
            <div class="sb-right nav-actions">
                <button class="btn-icon"><i data-lucide="search"></i></button>
                <div class="live-clock">LIVE &middot; <span id="global-clock">00:00:00</span></div>
            </div>
        </div>
    </nav>

    <div class="container section">
        <h1 style="font-size: 3rem; margin-bottom: 2rem;">TOURNAMENTS & EVENTS</h1>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 2rem;" id="events-grid">
            <div class="skeleton" style="height: 200px; border-radius: var(--radius-lg);"></div>
            <div class="skeleton" style="height: 200px; border-radius: var(--radius-lg);"></div>
        </div>
    </div>

    <script src="../js/config.js?v=1791806722"></script>
    <script src="../js/api.js?v=1791806722"></script>
    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetchAPI('/events');
            const gridEl = document.getElementById('events-grid');
            
            if (res.success) {
                if (res.data.length === 0) {
                    gridEl.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><h3>NO EVENTS</h3><p>There are currently no active tournaments.</p></div>`;
                    return;
                }
                
gridEl.innerHTML = res.data.map(event => `
    <a href="matches.html?event_id=${event.id}" class="team-card team-pattern-7" style="position: relative; display: flex; flex-direction: column;">
        <div class="team-badge" style="font-size: 2rem; border-color: var(--accent);">
            ${event.name.charAt(0)}
            <div class="badge-pattern"></div>
        </div>
        <div class="team-name" style="margin-bottom: 0.5rem; font-size: 1.25rem;">${event.name}</div>
        <div class="team-stats" style="margin-bottom: 0.5rem;">${event.location || 'TBA'}</div>
        <div class="team-stats" style="margin-bottom: 1.5rem; color: var(--accent);">${event.start_date ? event.start_date.substring(0,10) : 'TBA'}</div>
        <button class="btn btn-primary" style="color: var(--ink); margin-top: auto; width: 100%;">VIEW MATCHES</button>
    </a>
`).join('');

                lucide.createIcons();
            } else {
                gridEl.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Failed to load events.</div>';
            }
        });
    </script>
<script src="../js/ui.js?v=1791806722"></script>
</body>
</html>
